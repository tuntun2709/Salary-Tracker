<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary Tracker</title>
<style>
:root{--bg:#eef0f5;--card:#fff;--fg:#1c2230;--mut:#667085;--bd:#dfe3ec;--ac:#4f46e5;--acf:#fff;--in:#f6f7fb;--dg:#e5484d;--hv:#eef2ff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--fg:#e8ebf2;--mut:#9aa3b5;--bd:#2a3040;--ac:#7c83ff;--acf:#10131a;--in:#1f2430;--hv:#242a3a}}
*{box-sizing:border-box}html{font-size:clamp(12px,.5vw + 7.5px,16px)}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:1rem/1.35 "Segoe UI",system-ui,sans-serif}
#app{height:100vh;display:grid;gap:.9rem;padding:.9rem;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) clamp(300px,24vw,400px)}
.col{display:flex;flex-direction:column;gap:.9rem;min-height:0;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:.8rem;box-shadow:0 1px 3px rgba(16,24,40,.06);display:flex;flex-direction:column;gap:.55rem;min-height:0;min-width:0}
.row{display:flex;align-items:center;gap:.5rem;min-width:0}.fx{flex:1}.f2{flex:2}.eq button{flex:1}.lb{width:6.5rem;flex:none;color:var(--mut)}.lb2{width:3.2rem;flex:none;color:var(--mut)}
.fx,.f2{min-height:0}.row.fx{align-items:stretch;min-height:2.2rem}.row.fx>span{align-self:center}
h2{margin:0;font-size:1.15rem}h3{margin:0;font-size:.95rem;color:var(--mut);font-weight:600}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--in);border:1px solid var(--bd);border-radius:9px;padding:.4rem .6rem;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;background:var(--card)}
button{cursor:pointer;font-weight:600;white-space:nowrap;padding:.45rem .9rem;transition:.12s}button:hover{background:var(--hv);border-color:var(--ac)}
button.p{background:var(--ac);color:var(--acf);border-color:var(--ac)}button.p:hover{filter:brightness(1.1)}
button.d{color:var(--dg)}button.d:hover{border-color:var(--dg);background:var(--in)}button.sm{padding:.25rem .6rem;font-size:.85rem}
textarea{resize:none;flex:1;min-height:0;height:100%;width:100%}
.tbl{flex:1;min-height:0;overflow:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card);scrollbar-width:thin}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th{position:sticky;top:0;z-index:1;background:var(--in);color:var(--mut);font-weight:600;font-size:.85em;text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--bd)}
td{padding:.35rem .5rem;border-bottom:1px solid var(--bd);white-space:pre-line;overflow-wrap:anywhere;vertical-align:middle}
tr.sel td{background:var(--ac);color:var(--acf)}td[contenteditable]:focus{outline:2px solid var(--ac);outline-offset:-2px}
td input:not([type=checkbox]){width:100%;border:0;background:transparent;padding:.15rem .25rem}
input[type=checkbox]{accent-color:var(--ac);width:1.1rem;height:1.1rem;padding:0}
#sch{table-layout:auto}#sch td,#sch th{text-align:center;padding:.45rem .3rem}#sch td:last-child{white-space:nowrap}
#sch input[type=time]{width:4.6rem;font-size:.85rem;padding:.2rem .3rem;border:1px solid var(--bd);background:var(--in)}
input[type=time]::-webkit-calendar-picker-indicator{display:none}
#tot{min-width:9ch;text-align:right;background:var(--in);border:1px solid var(--bd);border-radius:9px;padding:.4rem .6rem;font-weight:700}
#calbox{padding:.6rem}#cnav{display:flex;justify-content:center;align-items:center;gap:.8rem}#cnav b{min-width:10rem;text-align:center;font-size:1.05rem}
#cal{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,1fr);gap:.2rem}
#cal div{display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:9px;min-height:0}#cal div:hover{background:var(--hv)}
#cal .h{color:var(--mut);cursor:default;font-weight:600;font-size:.85em}#cal .h:hover{background:none}#cal .we{color:var(--dg)}
.g{background:#16a34a!important;color:#fff!important}.t{background:#0e8a8a!important;color:#fff!important}.b{background:#2563eb!important;color:#fff!important}
#cal .sel{outline:2px solid var(--fg);outline-offset:-2px}
dialog{border:1px solid var(--bd);border-radius:14px;padding:1rem;background:var(--card);color:var(--fg)}dialog::backdrop{background:rgba(0,0,0,.4)}
@media(max-width:900px){html,body{overflow:auto}#app{height:auto;grid-template-columns:1fr}.card{min-height:340px}}
</style></head><body><div id=app>
<div class=col><div class=card><div class=row><button id=imp>Import History</button><input id=fn readonly placeholder="No file selected" style="flex:1"><button id=run class=p>RUN</button></div>
<label class=row style="cursor:pointer"><input type=checkbox id=filt checked>Site/Time Filtered</label></div>
<div class="card fx" id=calbox><div id=cnav><button id=pv class=sm>◀</button><b id=mt></b><button id=nx class=sm>▶</button></div><div id=cal></div></div>
<div class="card fx"><h3>History of selected date</h3><div class=tbl><table id=hist></table></div></div></div>
<div class=col><div class=card><div class="row eq"><button id=ad>Add Date</button><button id=dd class=d>Delete Date</button><button id=sc2>Calculate</button></div>
<div class=row style="flex-wrap:wrap"><span>Salary:</span><div id=tot></div><span>VND</span><span style="margin-left:auto">Rate:</span><input id=rate inputmode=numeric style="width:calc(4ch + 1.4rem);text-align:right"><span>k VND/hour</span></div></div>
<div class="card f2"><div class=tbl><table id=sum></table></div></div>
<div class="card f2" style="min-height:13rem;overflow:hidden"><h2>Comments</h2>
<div class="row fx"><span class=lb>Behaviour</span><textarea class=cm></textarea></div><div class="row fx"><span class=lb>Vocab</span><textarea class=cm></textarea></div>
<div class="row fx"><span class=lb>Grammar</span><textarea class=cm></textarea></div><div class="row fx"><span class=lb>Homework</span><textarea class=cm></textarea></div></div>
<div class="card"><div class="row eq"><button id=xd class=p>EXPORT DOCX</button><button id=xx class=p>EXPORT EXCEL</button><button id=rr>RESTORE</button></div></div></div>
<div class=col><div class="card fx"><div class=row><h2 style="flex:1">Configurations</h2><button id=bk class=sm>Backup</button><button id=rb class=sm>Load</button></div>
<h3>Student Information</h3><div class=row><span class=lb2>Profile</span><select id=prof style="flex:1"></select><button id=dp class=d>Delete</button></div>
<div class=row><span class=lb2>Name</span><input id=nm style="flex:1"></div>
<div class=row><span class=lb2>Grade</span><input id=gr style="width:calc(4ch + 1.4rem)"><span style="margin-left:.4rem;color:var(--mut)">School</span><input id=sc style="flex:1"></div>
<h3>Classes Information</h3><div class=row><span style="color:var(--mut)">Mark first</span><input id=fc inputmode=numeric style="width:calc(3ch + 1.4rem);text-align:right"><span style="color:var(--mut)">sites</span></div>
<div class=row><h3 style="flex:1">Sites filter</h3><button id=as class=sm>Add</button><button id=sd class="sm d">Del</button></div>
<div class=tbl style="flex:.8"><table id=sites></table></div>
<h3>Schedule</h3><div class=tbl style="flex:1.5"><table id=sch></table></div>
<div class="row eq"><button id=sp class=p>Save Configs</button><button id=ss>Save Session</button></div></div></div></div>
<input type=file id=rs accept=.json hidden><input type=file id=csv accept=.csv hidden>
<dialog id=dlg><div class=row style="margin-bottom:.6rem">Profile: <select id=sprof></select><button id=sdel class=d>Delete</button><button id=sx>Close</button></div><div class=tbl style="width:min(480px,80vw);height:300px"><table id=stab></table></div><small style="color:var(--mut)">Double-click a session to restore it.</small></dialog>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const KEY='salary-tracker-v1',DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{profiles:{},sessions:[]};
const persist=()=>localStorage.setItem(KEY,JSON.stringify(S));
const DEF=()=>({studentGrade:'',studentSchool:'',rate:'100',sitesFirstCheck:1,sitesFilter:{},datesFixed:[],datesSub:[],hours:Array(8).fill(0),timeIntervals:Array(8).fill('')});
let P=DEF(),pn='',data=[],fdata=[],rows=[],hl={},cur=new Date(),sel=null,selR=-1,dirty=false,siteD=new Set(),sname='';
const dow=d=>(new Date(d+'T00:00').getDay()+6)%7+1,dmy=d=>d.split('-').reverse().join('/'),ym=()=>cur.getFullYear()+'-'+pad(cur.getMonth()+1);
const wage=h=>`${Math.floor((+$('#rate').value||0)*h)},000 VND`;
const now=()=>{const t=new Date();return`${pad(t.getDate())}-${pad(t.getMonth()+1)}-${t.getFullYear()} ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`};
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)};
const CM=()=>[...document.querySelectorAll('.cm')];
/* ---------- profile ---------- */
function fillProf(){$('#prof').innerHTML='<option value="">(new profile)</option>'+Object.keys(S.profiles).map(n=>`<option>${esc(n)}</option>`).join('');$('#prof').value=pn}
function loadProf(n){P=n?structuredClone(S.profiles[n]):DEF();pn=n;$('#nm').value=n;$('#gr').value=P.studentGrade;$('#sc').value=P.studentSchool;$('#rate').value=P.rate;$('#fc').value=P.sitesFirstCheck;drawSch();drawSites();rows=[];hl={};sel=null;selR=-1;dirty=false;sname='';CM().forEach(x=>x.value='');drawAll();fillProf();homeAll()}
$('#prof').onchange=e=>{if(dirty&&rows.length&&confirm('Save current session first?'))saveSess();loadProf(e.target.value)};
function drawSch(){$('#sch').innerHTML='<tr><th><th>Fixed<th>Sub<th>Time</tr>'+['Mon','Tu','Wed','Thu','Fri','Sat','Sun'].map((n,i)=>{const d=i+1,iv=(P.timeIntervals[d]||'').split('\n')[1]||'(00:00 - 00:00)',[a,b]=iv.replace(/[()]/g,'').split(' - ');return`<tr><th>${n}<td><input type=checkbox ${P.datesFixed.includes(d)?'checked':''}><td><input type=checkbox ${P.datesSub.includes(d)?'checked':''}><td><input type=time value=${a}> - <input type=time value=${b}>`}).join('')}
const sRow=(s,t)=>`<tr><td><input value="${esc(s)}"><td><input value="${esc(t)}">`;
function drawSites(){$('#sites').innerHTML='<tr><th>Sites<th>Topic</tr>'+Object.entries(P.sitesFilter).map(([s,t])=>sRow(s,t)).join('')}
$('#as').onclick=()=>$('#sites').insertAdjacentHTML('beforeend',sRow('',''));
$('#sites').onclick=e=>{const tr=e.target.closest('tr');if(tr&&tr.rowIndex>0)[...$('#sites').rows].forEach(r=>r.classList.toggle('sel',r==tr))};
$('#sites').onfocusin=e=>{const c=e.target.closest('td'),v=e.target.value.trim();if(c&&c.cellIndex==0&&v){siteD=new Set(data.filter(r=>r.Site==v).map(r=>r.Date));drawCal()}};
function readCfg(){const fx=[],sb=[],h=Array(8).fill(0),ti=Array(8).fill(''),m=x=>x.split(':')[0]*60+ +x.split(':')[1];
 [...$('#sch').rows].slice(1).forEach((r,i)=>{const d=i+1,[f,s,a,b]=r.querySelectorAll('input'),hr=(m(b.value)-m(a.value))/60||0;h[d]=hr;ti[d]=(hr%1?+hr.toFixed(2):hr)+` tiếng\n(${a.value} - ${b.value})`;f.checked&&fx.push(d);s.checked&&sb.push(d)});
 for(let d=1;d<8;d++)if(!fx.includes(d)&&!sb.includes(d)&&fx.length){h[d]=h[fx[0]];ti[d]=ti[fx[0]]}
 const sf={};[...$('#sites').rows].slice(1).forEach(r=>{const[i,j]=r.querySelectorAll('input');if(i.value.trim())sf[i.value.trim()]=j.value});
 return{studentGrade:$('#gr').value,studentSchool:$('#sc').value,rate:$('#rate').value||'0',sitesFirstCheck:+$('#fc').value||0,sitesFilter:sf,datesFixed:fx,datesSub:sb,hours:h,timeIntervals:ti}}
$('#sp').onclick=()=>{const n=$('#nm').value.trim();if(!n)return alert('Default Empty Profile cannot be edited');S.profiles[n]=readCfg();P=structuredClone(S.profiles[n]);pn=n;persist();fillProf();alert('Profile saved successfully')};
$('#dp').onclick=()=>{if(!pn)return alert('Default Empty Profile cannot be deleted');if(!confirm('Delete this student?'))return;delete S.profiles[pn];S.sessions=S.sessions.filter(s=>s.profile!=pn);persist();loadProf('');fillSess()};
$('#bk').onclick=()=>dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'salary-tracker-backup.json');
$('#rb').onclick=()=>$('#rs').click();
$('#rs').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());Object.assign(S.profiles,o.profiles||{});(o.sessions||[]).forEach(x=>S.sessions.some(y=>y.id==x.id&&y.date==x.date)||S.sessions.push(x));persist();fillProf();fillSess();alert('Backup restored')}catch(err){alert('Invalid backup: '+err.message)}};
/* ---------- history import ---------- */
$('#csv').onchange=e=>{const f=e.target.files[0];if(!f)return;Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{try{
 const wide=r.meta.fields.length>3,host=u=>u.split('/')[2]||u;
 data=r.data.map(x=>{let D,T;if(wide){const[m,d,y]=x.date.split('/');D=`${y}-${pad(m)}-${pad(d)}`;T=x.time}else{const t=new Date(x.DateTime);D=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;T=`${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`}
  return{Date:D,Time:T,Content:(wide?x.title:x.PageTitle)||'NaN',Site:host((wide?x.url:x.NavigatedToUrl)||'NaN')}});
 const ds=data.map(r=>r.Date).sort();if(ds.length){const[y,m]=ds[ds.length-1].split('-');cur=new Date(+y,m-1,1)}
 $('#fn').value=`${f.name} (${data.length} rows)`;setTimeout(()=>home($('#fn')));siteD=new Set();drawCal()}catch(err){alert('Import failed: '+err.message)}}})};
function fit(d,t){const iv=(P.timeIntervals[dow(d)]||'').split('\n')[1];if(!iv)return true;const[a,b]=iv.replace(/[()]/g,'').split(' - '),e=b.split(':'),h=+t.split(':')[0];return +a.split(':')[0]<=h&&h<=(e[1]=='00'?+e[0]:+e[0]+1)}
$('#run').onclick=()=>{P=readCfg();if(!data.length)return alert('No history file detected / File empty');
 let sl=data.filter(r=>r.Date.startsWith(ym()));if(!sl.length)return alert('Month not found');
 const cs=Object.keys(P.sitesFilter),first=cs.slice(0,P.sitesFirstCheck);siteD=new Set();
 if($('#filt').checked&&cs.length)sl=sl.filter(r=>[...cs,'file'].some(s=>r.Site.startsWith(s))&&fit(r.Date,r.Time));
 sl=sl.map(r=>({...r,Content:P.sitesFilter[r.Site]||r.Content}));fdata=sl;
 const g={};sl.forEach(r=>(g[r.Date]??=[]).push(r));
 for(const d of Object.keys(g).sort()){const k=dow(d),fr=g[d];if(hl[d]=='g')continue;
  if(fr.some(r=>first.includes(r.Site))){if(P.datesFixed.includes(k)){const tp=first.filter(s=>fr.some(r=>r.Site==s)).map(s=>fr.find(r=>r.Site==s).Content).join(', ');rows.push({date:d,topic:tp,time:P.timeIntervals[k],wage:wage(P.hours[k])});hl[d]='g'}else hl[d]='t'}
  else hl[d]=P.datesFixed.includes(k)?'b':P.datesSub.includes(k)?'t':hl[d]}
 rows.sort((a,b)=>a.date<b.date?-1:1);dirty=true;drawAll()};
/* ---------- calendar & summary ---------- */
function drawCal(){const y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),o=(new Date(y,m,1).getDay()+6)%7;
 $('#mt').textContent=cur.toLocaleString('en',{month:'long',year:'numeric'});
 let h=DAYS.map(d=>`<div class=h>${d}</div>`).join('')+'<div class=h></div>'.repeat(o);
 for(let i=1;i<=n;i++){const d=`${y}-${pad(m+1)}-${pad(i)}`;h+=`<div data-d=${d} class="${siteD.has(d)?'t':hl[d]||''} ${d==sel?'sel':''} ${(o+i-1)%7>4?'we':''}">${i}</div>`}
 $('#cal').innerHTML=h}
$('#cal').onclick=e=>{const d=e.target.dataset.d;if(!d)return;sel=d;const L=($('#filt').checked&&fdata.length?fdata:data).filter(r=>r.Date==d).reverse();
 $('#hist').innerHTML='<colgroup><col><col><col style="width:30%"></colgroup><tr><th>Time<th>Content<th>Site</tr>'+(L.length?L.map(r=>`<tr><td>${esc(r.Time)}<td>${esc(r.Content)}<td>${esc(r.Site)}`).join(''):'<tr><td colspan=3>No history for this date');drawCal();fitCols()};
$('#pv').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);drawCal()};
$('#nx').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);drawCal()};
const total=()=>rows.reduce((a,r)=>a+(parseInt(String(r.wage).split(' ')[0].replace(/,/g,''))||0),0);
function drawRows(){$('#sum').innerHTML='<colgroup><col><col><col><col></colgroup><tr><th>Date<th>Topic<th>Time<th>Wage</tr>'+rows.map((r,i)=>`<tr data-i=${i} class="${i==selR?'sel':''}"><td>${r.date}<td contenteditable>${esc(r.topic)}<td contenteditable>${esc(r.time)}<td contenteditable>${esc(r.wage)}`).join('');$('#tot').textContent=total().toLocaleString('en-US');fitCols()}
function drawAll(){drawCal();drawRows()}
$('#sum').onclick=e=>{const tr=e.target.closest('tr');if(!tr||tr.dataset.i==null)return;selR=+tr.dataset.i;$('#sum').querySelectorAll('tr').forEach(r=>r.classList.toggle('sel',r==tr))};
$('#sum').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();e.target.blur()}};
$('#sum').onfocusout=e=>{const td=e.target.closest('td'),i=td&&td.parentNode.dataset.i;if(i==null||td.cellIndex<1)return;const r=rows[i],c=td.cellIndex,v=td.innerText.trim();
 if(c==1)r.topic=v;if(c==3)r.wage=v;if(c==2){r.time=v;r.wage=wage(parseFloat(v)||0)}dirty=true;drawRows()};
$('#ad').onclick=()=>{if(!sel)return alert('Select a date on the calendar first');P=readCfg();const k=dow(sel);rows.push({date:sel,topic:'',time:P.timeIntervals[k],wage:wage(P.hours[k])});rows.sort((a,b)=>a.date<b.date?-1:1);hl[sel]='g';dirty=true;drawAll()};
$('#dd').onclick=()=>{if(selR<0||!rows[selR])return;P=readCfg();const d=rows[selR].date,k=dow(d);rows.splice(selR,1);selR=-1;if(!rows.some(r=>r.date==d))hl[d]=P.datesSub.includes(k)?'t':P.datesFixed.includes(k)?'b':'';dirty=true;drawAll()};
/* ---------- sessions ---------- */
let sfilt='All sessions',selS=null;
function fillSess(){const ps=['All sessions',...Object.keys(S.profiles)];$('#sprof').innerHTML=ps.map(p=>`<option>${esc(p)}</option>`).join('');$('#sprof').value=ps.includes(sfilt)?sfilt:'All sessions';sfilt=$('#sprof').value;selS=null;
 $('#stab').innerHTML='<tr><th>Session<th>Date<th>Name</tr>'+S.sessions.filter(s=>sfilt=='All sessions'||s.profile==sfilt).reverse().map(s=>`<tr data-id=${s.id}><td>${s.id}<td>${s.date}<td>${esc(s.name)}`).join('')}
function saveSess(nm){const d=now();S.sessions.push({id:Math.max(0,...S.sessions.map(s=>+s.id))+1,name:nm||sname||(pn+'_'+d),date:d,profile:pn,rows:structuredClone(rows),hl:{...hl},cm:CM().map(x=>x.value),cur:cur.toISOString()});persist();dirty=false;fillSess()}
function restoreSess(id){const s=S.sessions.find(x=>x.id==id);if(!s)return;if(S.profiles[s.profile])loadProf(s.profile);rows=structuredClone(s.rows);hl={...s.hl};cur=new Date(s.cur);CM().forEach((x,i)=>x.value=s.cm[i]||'');sname=s.name;sel=null;dirty=false;drawAll()}
$('#ss').onclick=()=>{saveSess();alert('Session saved successfully')};
$('#rr').onclick=()=>{fillSess();$('#dlg').showModal()};$('#sx').onclick=()=>$('#dlg').close();
$('#sprof').onchange=e=>{sfilt=e.target.value;fillSess()};
$('#stab').onclick=e=>{const tr=e.target.closest('tr');if(tr&&tr.dataset.id){selS=tr.dataset.id;[...$('#stab').rows].forEach(r=>r.classList.toggle('sel',r==tr))}};
$('#stab').ondblclick=e=>{const tr=e.target.closest('tr');if(tr&&tr.dataset.id){restoreSess(tr.dataset.id);$('#dlg').close()}};
$('#sdel').onclick=()=>{if(selS&&confirm('Delete this session?')){S.sessions=S.sessions.filter(x=>x.id!=selS);persist();fillSess()}};
onbeforeunload=e=>{if(dirty&&rows.length){e.preventDefault();return e.returnValue=''}};
/* ---------- exports ---------- */
const intro=()=>[[$('#nm').value,$('#gr').value],[$('#sc').value,rows.length?dmy(rows[0].date):'']];
const monthsOf=()=>[...new Set(rows.map(r=>r.date.split('-')[1]))].join('+');
async function tplBuf(){try{const r=await fetch('ClassesSummary.docx');if(r.ok)return await r.arrayBuffer()}catch(e){}
 const b=atob($('#tpl').textContent.trim());return Uint8Array.from(b,c=>c.charCodeAt(0)).buffer}
$('#xd').onclick=async()=>{try{if(!rows.length)return alert('Nothing to export');P=readCfg();
 const z=await JSZip.loadAsync(await tplBuf()),W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',XN='http://www.w3.org/XML/1998/namespace';

 const q=(n,t)=>[...n.children].filter(c=>c.localName==t),body=doc.getElementsByTagNameNS(W,'body')[0],ps=q(body,'p'),tb=q(body,'tbl');
